<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark">
<title>Portal · Elevation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0D0A16; --panel:#15111F; --panel2:#1C1729; --ink:#FFFFFF; --ink2:#D5D0E0; --muted:#A198B5; --line:#2B2439;
  --accent:#7C3AED; --accent2:#A78BFA; --good:#4ADE80; --mid:#FBBF24; --bad:#F87171;
  --s1:#9085e9; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#3987e5;
  --m1:#9085e9; --m2:#d95926; --serie:#9085e9; --serie2:#199e70; --cond:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45}
button,input{font:inherit;color:inherit}
a{color:var(--accent2)}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
[hidden]{display:none!important}

.top{position:sticky;top:0;z-index:20;background:rgba(13,10,22,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{font-family:var(--cond);font-weight:600;letter-spacing:.14em;font-size:15px}
.brand i{color:var(--accent2);font-style:normal}
.tabs{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:7px;cursor:pointer;font-size:14px}
.tabs button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:500}
.modo-cliente .tabs,.modo-cliente .pick{display:none}
.cab-der{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px 12px}
.ico{width:15px;height:15px;flex:none}
.ir-agencia{border:1px solid var(--line);background:transparent;color:var(--muted);padding:5px 10px;border-radius:8px;cursor:pointer;font-size:12.5px;transition:all .15s}
.ir-agencia:hover{color:var(--ink);border-color:#3d3450}
.ir-agencia[aria-pressed="true"]{color:#fff;background:rgba(124,58,237,.32);border-color:transparent}
.modo-cliente .ir-agencia{display:none}
.alertas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px;margin:8px 0 12px;align-items:start}
.alerta{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0;border-top:3px solid var(--line)}
.alerta.mal{border-top-color:var(--bad)} .alerta.ojo{border-top-color:var(--mid)} .alerta.bien{border-top-color:var(--good)}
.alerta h3{display:flex;align-items:center;gap:7px;margin:0;font-size:14px;font-weight:600}
.alerta h3 span{flex:1;min-width:0}
.alerta h3 b{font-family:var(--cond);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.alerta>p{margin:3px 0 0;color:var(--muted);font-size:12px;line-height:1.35}
.alerta .lista{margin:8px -14px -12px;max-height:210px;overflow-y:auto;border-top:1px solid var(--line)}
.alerta .lista li{padding:6px 14px;font-size:13px}
.alerta .lista b{font-size:12.5px;white-space:nowrap}
.alerta .alerta-ok{color:var(--good);margin-top:8px;font-size:13px}
.alerta-ok{color:var(--good);font-size:13px}
.sem-btn button{border:0;padding:0;cursor:pointer;transition:opacity .15s,filter .15s}
.sem-btn button:hover{filter:brightness(1.15)}
.sem-btn:has(button[aria-pressed="true"]) button[aria-pressed="false"]{opacity:.4}
.mer-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;color:var(--ink2);padding:5px 10px;border-radius:999px;cursor:pointer;font-size:13px;transition:all .15s}
.mer-chip i{width:9px;height:9px;border-radius:50%}
.mer-chip[aria-pressed="true"]{background:var(--panel2);border-color:var(--accent2);color:#fff}
.mer-chip:hover{background:var(--panel2)}
.pos{display:inline-block;width:20px;color:var(--muted);font-style:normal;font-size:12px}
.lista small{color:var(--muted);font-weight:400;margin-left:8px;font-size:12px}
.faltan{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:0 16px 8px}
.lista-alta{max-height:280px;overflow-y:auto}
.ag-cab{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px}
.ag-btns{display:flex;gap:6px}
.btn[aria-pressed="true"]{background:rgba(124,58,237,.32);border-color:transparent;color:#fff}
.ag-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px;padding:12px 16px 14px;background:var(--panel2);border-block:1px solid var(--line)}
.ag-form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
.ag-form input,.ag-form select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;font-size:14px;width:100%}
.ag-form .ancho{grid-column:1/-1;margin:0}
.ag-form .volver{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.ag-form .volver select{width:auto;max-width:100%}
.btn.peligro{border-color:var(--bad);color:var(--bad)}
.graf-des.graf-chips{border-top:0;padding-top:0;margin:0 0 10px}
.semaforo.sem-btn{height:16px}
.fl-bien{color:var(--good)} .fl-mal{color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:10px;margin-bottom:10px}
.tiles .kpi{padding:12px 14px}
.tiles .kpi>small{display:block;line-height:1.3}
.tile{--c:transparent;position:relative;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px;min-width:0;cursor:pointer;overflow:hidden;transition:border-color .18s,background .18s,transform .18s}
.tile::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--c);transition:background .18s}
.tile:hover{border-color:#3d3450;background:var(--panel2)}
.tile:active{transform:scale(.985)}
.tile[data-n="1"]{--c:var(--m1)} .tile[data-n="2"]{--c:var(--m2)}
.tile[aria-pressed="true"]{background:var(--panel2);border-color:var(--c)}
.tile-t{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px}
.tile[aria-pressed="true"] .tile-t{color:var(--ink)}
.tile-t>span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile-pto{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--line);flex:none;transition:all .18s}
.tile[aria-pressed="true"] .tile-pto{background:var(--c);border-color:var(--c);box-shadow:inset 0 0 0 3px var(--panel2)}
.tile b{display:block;font-family:var(--cond);font-weight:600;font-size:26px;line-height:1.25;margin-top:5px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.tiles .kpi b{font-size:26px;margin-top:5px}
.kpi-t{display:flex!important;align-items:center;gap:7px}
.graf{padding:14px 16px 10px}
.graf-cab{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-bottom:10px}
.graf-ley{display:flex;flex-wrap:wrap;gap:6px 22px}
.graf-ley-m{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.graf-ley-m b{font-family:var(--cond);font-weight:600;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.sw{width:12px;height:12px;border-radius:3px;background:var(--c);flex:none}
.sw.lin{height:3px;width:16px;border-radius:2px}
.graf-rango{color:var(--muted);font-size:12px;white-space:nowrap}
.graf-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-bottom:8px;font-size:13px;color:var(--muted)}
.graf-per,.graf-seg{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.graf-per::-webkit-scrollbar{display:none}
.graf-per button,.graf-seg button{border:0;background:transparent;color:var(--muted);padding:4px 10px;border-radius:7px;cursor:pointer;font-size:13px;white-space:nowrap;transition:background .15s,color .15s}
.graf-per button:hover,.graf-seg button:hover{color:var(--ink)}
.graf-per button[aria-pressed="true"],.graf-seg button[aria-pressed="true"]{background:rgba(124,58,237,.32);color:#fff}
.graf-tabbtn{display:inline-flex;align-items:center;gap:6px;margin-left:auto;border:1px solid var(--line);background:transparent;color:var(--muted);padding:4px 10px;border-radius:9px;cursor:pointer;font-size:13px;transition:all .15s}
.graf-tabbtn:hover{color:var(--ink)}
.graf-tabbtn[aria-pressed="true"]{background:rgba(124,58,237,.32);color:#fff;border-color:transparent}
.graf-nota{margin:0 0 6px;color:var(--muted);font-size:12px}
.graf-des{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-top:10px;border-top:1px solid var(--line);margin-top:4px;font-size:12px;color:var(--muted)}
.graf-des>span{margin-right:4px}
.graf-des button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;color:var(--ink2);padding:5px 10px;border-radius:999px;cursor:pointer;font-size:12.5px;transition:all .15s}
.graf-des button:hover{border-color:#3d3450;background:var(--panel2)}
.graf-des button[aria-pressed="true"]{background:rgba(124,58,237,.32);border-color:transparent;color:#fff}
.graf-tabla{max-height:340px;overflow-y:auto;margin-bottom:6px;border:1px solid var(--line);border-radius:8px}
.graf .chart{padding-left:0;padding-right:0;padding-bottom:6px}
.graf .leyenda{padding-left:0}
.chart text.val{fill:var(--ink);font-size:10.5px;font-weight:500;paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round;font-variant-numeric:tabular-nums;pointer-events:none}
.chart .hit{cursor:crosshair}
.chart .hit:hover{fill:rgba(255,255,255,.05)}
.chart .parcial{opacity:.55}
@media (prefers-reduced-motion:no-preference){
  .anim .barra{transform-box:fill-box;transform-origin:bottom;animation:crece .42s cubic-bezier(.2,.8,.2,1) both}
  .anim .linea{stroke-dasharray:1;animation:traza .6s ease-out both}
  .anim .val,.anim .punto-g{animation:aparece .35s ease-out .22s both}
}
@keyframes crece{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes traza{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes aparece{from{opacity:0}to{opacity:1}}
.pick{position:relative}
.pick>button{display:flex;align-items:center;gap:8px;max-width:260px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 12px;cursor:pointer;font-size:14px}
.pick>button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick>button[data-activo="1"]{border-color:var(--accent2)}
.pick>button::after{content:"▾";color:var(--muted)}
.menu{position:absolute;top:calc(100% + 6px);left:0;width:300px;max-width:calc(100vw - 32px);background:var(--panel2);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.6);padding:8px;z-index:30}
.menu input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.menu ul{list-style:none;margin:0;padding:0;max-height:min(420px,60vh);overflow-y:auto}
.menu li button{width:100%;display:flex;justify-content:space-between;gap:10px;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:14px}
.menu li button:hover,.menu li button[aria-selected="true"]{background:rgba(124,58,237,.28)}
.menu small{color:var(--muted);white-space:nowrap}
.fechas{display:flex;flex-wrap:wrap;gap:2px;align-items:center}
.fechas button{border:1px solid transparent;background:transparent;color:var(--muted);padding:6px 10px;border-radius:8px;cursor:pointer;font-size:13px;white-space:nowrap}
.fechas button[aria-pressed="true"]{color:#fff;border-color:var(--accent2);background:rgba(124,58,237,.18)}
.rango{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.rango input{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 7px;font-size:13px}
.vivo{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.vivo.off{color:var(--bad)} .vivo.off .dot{background:var(--bad)}
.vivo.pasado .dot{background:var(--muted)}
@media (prefers-reduced-motion:no-preference){.vivo:not(.off):not(.pasado) .dot{animation:latido 2s ease-in-out infinite} .nueva{animation:flash 2.5s ease-out}}
@keyframes latido{50%{opacity:.3}}
@keyframes flash{0%{background:rgba(124,58,237,.45)}100%{background:transparent}}

.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 56px}
h1{font-family:var(--cond);font-weight:600;font-size:28px;line-height:1.15;margin:0}
h2{font-family:var(--cond);font-weight:600;font-size:19px;margin:0}
.sub{color:var(--muted);margin:4px 0 0;font-size:13px}
.cab{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 16px;margin-bottom:16px}
.fuentes{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.fuentes span{display:inline-flex;align-items:center;gap:6px}
.fuentes i{width:7px;height:7px;border-radius:50%;background:var(--good)}
.fuentes i.lento{background:var(--mid)} .fuentes i.mal{background:var(--bad)}
.aviso{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);margin-bottom:14px;font-size:14px}
.aviso.err{color:var(--bad)} .aviso.ok{color:var(--good)}
.aviso a.btn{margin-left:8px}
.aviso-app{border-color:var(--mid);display:flex;flex-direction:column;gap:8px}
.aviso-app small{color:var(--muted);font-size:12px}
.aviso-link{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.aviso-link code{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:13px;overflow-wrap:anywhere;min-width:0}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.kpi>span{display:block;color:var(--muted);font-size:13px}
.kpi b{display:block;font-family:var(--cond);font-weight:600;font-size:32px;line-height:1.2;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi small{color:var(--muted);font-size:12px}
.kpis.chico{grid-template-columns:repeat(3,1fr)}
.kpis.chico .kpi{padding:10px 14px}
.kpis.chico b{font-size:21px}
.g{color:var(--good)} .m{color:var(--mid)} .r{color:var(--bad)} .na{color:var(--muted);font-weight:400}

.bloque{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden}
.bloque>h2{padding:13px 16px 0}
details.bloque>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px}
details.bloque>summary::-webkit-details-marker{display:none}
details.bloque>summary::after{content:"▾";color:var(--muted);transition:transform .15s}
details.bloque[open]>summary::after{transform:rotate(180deg)}
details.bloque>summary h2{font-size:16px}
details.bloque>summary small{color:var(--muted);margin-left:auto;font-size:13px;font-variant-numeric:tabular-nums}
.chart{position:relative;padding:2px 16px 14px}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.tip{position:absolute;pointer-events:none;z-index:5;top:4px;background:#fff;color:#0D0A16;font-size:12px;padding:6px 9px;border-radius:7px;white-space:nowrap;transform:translateX(-50%);font-variant-numeric:tabular-nums;font-weight:500}
.sinchart{padding:0 16px 16px;color:var(--muted);font-size:14px}

.tortas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:12px;margin-top:12px}
.leyenda{display:flex;flex-wrap:wrap;gap:4px 14px;padding:0 16px 6px;font-size:12px;color:var(--ink2)}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.titulo-sec{margin-top:22px}
.torta{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 16px}
.torta h2{font-size:16px;margin-bottom:10px}
.torta .in{display:grid;grid-template-columns:130px minmax(0,1fr);gap:16px;align-items:center}
.torta svg{width:130px;height:130px;display:block}
.torta svg path{cursor:default}
.ley{list-style:none;margin:0;padding:0;font-size:13px}
.ley li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:3px 0}
.ley i{width:10px;height:10px;border-radius:3px;align-self:center}
.ley span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.ley b{font-weight:600;font-variant-numeric:tabular-nums}
.ley small{display:block;color:var(--muted);font-weight:400;text-align:right;font-size:11px}
.vacio{color:var(--muted);font-size:14px;padding:6px 0}

.tablebox{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 14px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:500;font-size:13px;color:var(--muted);background:var(--panel2);position:sticky;top:0}
th button{border:0;background:none;color:inherit;padding:0;cursor:pointer}
th button[data-dir]::after{content:attr(data-dir);margin-left:4px}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;border-top:1px solid var(--line);border-bottom:0}
tr.fila{cursor:pointer}
tr.fila:hover td{background:var(--panel2)}
td.nom{white-space:normal;min-width:150px}
td.nom b{font-weight:500}
td.nom small{display:block;color:var(--muted);font-size:12px}
td.izq,th.izq{text-align:left}
.punto{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:7px;vertical-align:1px}
.punto.lento{background:var(--mid)}
.mer{display:flex;align-items:center;justify-content:flex-end;gap:9px}
.gauge{width:70px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.gauge i{display:block;height:100%;background:currentColor}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;border:1px solid var(--line);color:var(--ink2)}
.tag.ok{color:var(--good);border-color:rgba(74,222,128,.4)}
.tag.pend{color:var(--mid);border-color:rgba(251,191,36,.4)}
.tag.mal{color:var(--bad);border-color:rgba(248,113,113,.4)}
.prods{font-size:12px;color:var(--muted);white-space:normal;max-width:300px;text-align:left}
.pie{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.btn{display:inline-block;border:1px solid var(--line);background:var(--panel2);color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;text-decoration:none}
.btn.pri{background:var(--accent);border-color:var(--accent)}
.buscar{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px}
.barra{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:13px 16px}
.check{display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-size:13px;cursor:pointer}

.dos{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
.dos .bloque{margin-top:0}
.semaforo{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin:12px 16px}
.semaforo i{display:block;height:100%}
.semaforoley{display:flex;flex-wrap:wrap;gap:6px 18px;padding:0 16px 14px;font-size:13px;color:var(--ink2)}
.lista{list-style:none;margin:8px 0 0;padding:0}
.lista li{display:flex;justify-content:space-between;gap:12px;padding:8px 16px;border-top:1px solid var(--line);cursor:pointer;font-variant-numeric:tabular-nums}
.lista li:hover{background:var(--panel2)}
.lista span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 16px}
.prog i{display:block;height:100%;background:var(--accent2)}
.login{max-width:440px;margin:14vh auto 0;padding:0 16px}
.skel{height:120px;border-radius:12px;background:var(--panel);border:1px solid var(--line);margin-bottom:10px}

.ley b{text-align:right}
@media (max-width:1100px){
  .top{position:relative}
  .kpi b{font-size:22px;overflow-wrap:normal}
  .tile b,.tiles .kpi b{font-size:22px;overflow-wrap:normal}
}
@media (max-width:900px){
  .vivo{margin-left:0;width:100%}
  .dos,.tortas{grid-template-columns:1fr}
}
@media (max-width:640px){
  .top-in{padding:8px 16px;gap:8px}
  .wrap{padding:16px 16px 44px}
  h1{font-size:23px}
  .kpis,.kpis.chico{grid-template-columns:1fr 1fr}
  .tiles{grid-template-columns:1fr 1fr;gap:8px}
  .tile{padding:10px 11px}
  .tile b,.tiles .kpi b,.kpis .kpi b{font-size:19px;white-space:nowrap}
  .tile small{font-size:11px}
  .tile-t{font-size:12px;gap:5px}
  .graf-ley-m b{font-size:17px}
  .kpi b{font-size:24px}
  .kpis.chico b{font-size:18px}
  .kpi{padding:11px 12px}
  .hm{display:none}
  th,td{padding:9px 8px;font-size:14px}
  th:first-child,td:first-child{padding-left:12px}
  td.nom{min-width:0;width:100%}
  .gauge{display:none}
  .pick{flex:1 1 100%;min-width:0;order:3}
  .pick>button{max-width:none;width:100%;justify-content:space-between}
  .menu{width:100%;max-width:none}
  .fechas{order:4} .rango{order:5} .vivo{order:6}
  .fechas{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:2px}
  .torta .in{grid-template-columns:minmax(0,1fr);gap:10px}
  .torta svg{margin:0 auto}
  .chart{padding:2px 8px 12px}
}
</style>
</head>
<body>
<section class="login" id="login" hidden>
  <h1>Portal Elevation</h1>
  <p class="sub" id="loginSub">Para entrar necesitás el link de acceso de Elevation. Pedíselo a Julián.</p>
  <p class="aviso err" id="loginErr" hidden></p>
</section>

<div id="app" hidden>
  <div class="top"><div class="top-in">
    <div class="brand">ELEVATION<i>.</i></div>
    <div class="tabs" role="group" aria-label="Vista">
      <button data-v="general">Clientes</button>
    </div>
    <div class="pick" id="pick">
      <button type="button" id="pickBtn" aria-haspopup="listbox" aria-expanded="false"><span id="pickTxt">Elegir cliente</span></button>
      <div class="menu" id="menu" hidden>
        <input id="menuQ" type="search" placeholder="Buscar cliente" aria-label="Buscar cliente" autocomplete="off">
        <ul id="menuL" role="listbox"></ul>
      </div>
    </div>
    <div class="fechas" role="group" aria-label="Fechas" id="fechas">
      <button data-p="hoy">Hoy</button>
      <button data-p="ayer">Ayer</button>
      <button data-p="7d">7 días</button>
      <button data-p="30d">30 días</button>
      <button data-p="mes">Este mes</button>
      <button data-p="mesant">Mes pasado</button>
      <button data-p="rango">Elegir fechas</button>
    </div>
    <div class="rango" id="rango" hidden>
      <input type="date" id="dDesde" aria-label="Desde"><span>a</span><input type="date" id="dHasta" aria-label="Hasta">
    </div>
    <div class="vivo" id="vivo" role="status"><span class="dot" aria-hidden="true"></span><span id="vivoTxt">Conectando…</span></div>
    <button type="button" class="ir-agencia" data-v="agencia">General</button>
  </div></div>
  <main class="wrap">
    <div class="aviso" id="aviso" role="status" hidden></div>
    <div id="vista"></div>
  </main>
</div>

<script src="config.js"></script>
<script src="portal.js"></script>
</body>
</html>
